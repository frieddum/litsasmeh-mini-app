<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e95d3f" />
    <meta name="color-scheme" content="light" />
    <title>Лицесмешиватель 3000</title>
    <link rel="icon" href="./favicon.svg" />
    <meta property="og:image" content="./og.png" />
    <link rel="stylesheet" href="./mini.css?v=5" />
    <script src="https://telegram.org/js/telegram-web-app.js?63" defer></script>
    <script src="./app.js?v=5" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">НИИ прикладной физиономики представляет</p>
          <h1>Лицесмешиватель <span>3000</span></h1>
        </div>
        <p class="lede">Крути ползунки, пока не получится совсем дурацкое лицо.</p>
      </header>


      <section class="workspace" aria-label="Интерактивный генератор лиц">
        <section class="stage-card">
          <div class="sticker sticker-top" aria-hidden="true">ТАЩИ<br />ПАЛЬЦЕМ</div>
          <canvas id="stage" width="960" height="960" tabindex="0" aria-label="Смешное рисованное лицо. Перетаскивайте, чтобы вращать голову"></canvas>
          <div class="diagnosis-card">
            <span>ДИАГНОЗ</span>
            <strong id="diagnosis">Синдром делового пельменя</strong>
            <em id="treatment">Лечение не требуется.</em>
          </div>
          <div class="stage-meta">
            <div>
              <span class="meta-label">ОБЪЕКТ НАБЛЮДЕНИЯ</span>
              <strong id="face-name">Инспектор Булочка</strong>
            </div>
